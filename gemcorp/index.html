<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="GEMCORP FLOW — Investment Intelligence &amp; Deal Management System. Concept prototype."/>
<title>GEMCORP FLOW — Investment Intelligence &amp; Deal Management</title>
<style>
/* ================= GEMCORP FLOW — institutional design system ================= */
:root{
  --ink:#080B10; --ink-1:#0C1119; --ink-2:#111823; --ink-3:#18202D; --ink-4:#202A39;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --txt:#EDF0F4; --txt-2:#96A0AE; --txt-3:#5F6A78; --txt-4:#3E4753;
  --gold:#C9A961; --gold-2:#E2CB92; --gold-dim:#8A7440;
  --ok:#3FB984; --warn:#E0A458; --bad:#E0605F; --info:#5B8DEF; --violet:#9B8CEF;
  --rail:238px; --top:64px; --r:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.005em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#222C3A;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#2D3A4B}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{display:flex;height:100vh}

/* ---------------- rail ---------------- */
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--ink-1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.brand{height:var(--top);flex:0 0 var(--top);display:flex;align-items:center;gap:11px;padding:0 20px;
  border-bottom:1px solid var(--line)}
.brand .mk{width:30px;height:30px;flex:0 0 30px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold),var(--gold-dim));color:#0B0906;font-weight:800;font-size:13px;
  font-family:var(--serif)}
.brand b{font-size:14.5px;font-weight:650;letter-spacing:.14em}
.brand small{display:block;font-size:9px;letter-spacing:.18em;color:var(--txt-3);font-weight:600;margin-top:1px}
.navwrap{flex:1;overflow-y:auto;padding:14px 12px}
.navlbl{font-size:9.5px;letter-spacing:.16em;color:var(--txt-4);font-weight:700;padding:0 10px;margin:16px 0 7px}
.navlbl:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--txt-2);
  font-size:13.5px;font-weight:500;position:relative;transition:background .14s,color .14s}
.nav:hover{background:rgba(255,255,255,.035);color:var(--txt)}
.nav.on{background:rgba(201,169,97,.1);color:var(--gold-2)}
.nav.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:2px;background:var(--gold);border-radius:0 2px 2px 0}
.nav svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--txt-3);background:var(--ink-3);
  padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.nav.on .cnt{background:rgba(201,169,97,.18);color:var(--gold-2)}
.nav .cnt.hot{background:rgba(224,96,95,.16);color:var(--bad)}
.railfoot{padding:12px;border-top:1px solid var(--line)}
.mkbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;height:40px;border-radius:9px;
  border:1px dashed var(--line-2);color:var(--txt-2);font-size:11.5px;font-weight:600;transition:.16s;
  white-space:nowrap;letter-spacing:-.01em;padding:0 6px}
.mkbtn svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:2}
.mkbtn:hover{border-color:var(--gold);color:var(--gold-2);background:rgba(201,169,97,.06)}

/* ---------------- shell ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{height:var(--top);flex:0 0 var(--top);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:16px;padding:0 26px;background:var(--ink-1)}
.top h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.crumbs{font-size:11px;color:var(--txt-3);letter-spacing:.04em}
.demo{font-size:9.5px;font-weight:750;letter-spacing:.13em;color:var(--gold-2);
  background:rgba(201,169,97,.1);border:1px solid rgba(201,169,97,.28);padding:4px 9px;border-radius:5px;white-space:nowrap}
.sp{flex:1}
.search{position:relative;width:280px}
.search input{width:100%;height:34px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;
  padding:0 12px 0 34px;outline:none;font-size:13px}
.search input:focus{border-color:var(--line-2);background:var(--ink-3)}
.search svg{position:absolute;left:11px;top:9px;width:15px;height:15px;stroke:var(--txt-3);fill:none;stroke-width:2}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--txt-2);position:relative}
.ico:hover{background:var(--ink-3);color:var(--txt)}
.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.ico .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:9px;background:var(--bad)}
.me{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line)}
.me .av{width:31px;height:31px;border-radius:50%;background:linear-gradient(140deg,#2A3purple,#1B2532);
  background:linear-gradient(140deg,#2C3849,#18202B);border:1px solid var(--line-2);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--gold-2)}
.me b{font-size:12.5px;font-weight:600;display:block;line-height:1.25}
.me span{font-size:10.5px;color:var(--txt-3)}
.view{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:28px 32px 80px;max-width:1680px}

/* ---------------- typography ---------------- */
.hero{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-.02em;line-height:1.15}
.hero em{font-style:italic;color:var(--gold-2)}
.lede{color:var(--txt-2);font-size:15px;margin-top:9px}
.sec{display:flex;align-items:baseline;gap:12px;margin:34px 0 15px}
.sec h2{font-size:11px;font-weight:750;letter-spacing:.16em;color:var(--txt-3)}
.sec .ln{flex:1;height:1px;background:var(--line)}
.sec a,.sec button{font-size:11.5px;color:var(--gold-2);font-weight:600;letter-spacing:.03em}
.sec a:hover,.sec button:hover{color:var(--gold)}

/* ---------------- cards ---------------- */
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:13.5px;font-weight:650}
.card-h p{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.card-b{padding:18px}
.kpi{padding:18px 20px;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r);
  position:relative;overflow:hidden;transition:border-color .18s,transform .18s;cursor:pointer}
.kpi:hover{border-color:var(--line-2);transform:translateY(-2px)}
.kpi .l{font-size:10.5px;letter-spacing:.11em;color:var(--txt-3);font-weight:650}
.kpi .v{font-family:var(--serif);font-size:31px;margin-top:11px;letter-spacing:-.02em;line-height:1}
.kpi .d{font-size:11px;color:var(--txt-3);margin-top:9px;display:flex;align-items:center;gap:5px}
.kpi .d b{font-weight:650}
.kpi.crit .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.gold .v{color:var(--gold-2)}
.kpi .spark{position:absolute;right:0;bottom:0;left:0;height:34px;opacity:.5}

/* ---------------- map ---------------- */
.mapwrap{position:relative;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mapwrap svg{width:100%;height:auto;display:block}
.mland{fill:#141C27;stroke:#1E2836;stroke-width:.7}
.mland.act{fill:#1D2836;cursor:pointer;transition:fill .2s}
.mland.act:hover,.mland.act.on{fill:#2A3A4E}
.mpin{cursor:pointer}
.mpin circle.core{fill:var(--gold)}
.mpin circle.halo{fill:var(--gold);opacity:.16}
.mpin.hot circle.core{fill:var(--bad)} .mpin.hot circle.halo{fill:var(--bad)}
.maplegend{position:absolute;left:18px;bottom:16px;display:flex;gap:16px;flex-wrap:wrap;
  background:rgba(8,11,16,.82);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:9px 13px}
.maplegend div{font-size:11px;color:var(--txt-2);display:flex;align-items:center;gap:7px}
.maplegend i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.mapstat{position:absolute;right:18px;bottom:16px;background:rgba(8,11,16,.82);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:8px;padding:12px 15px;min-width:170px}
.mapstat .t{font-size:10px;letter-spacing:.12em;color:var(--txt-3);font-weight:700}
.mapstat .r{display:flex;justify-content:space-between;gap:14px;font-size:12px;margin-top:8px}
.mapstat .r b{color:var(--gold-2)}
.tip{position:absolute;transform:translate(-50%,-140%);background:var(--ink-3);border:1px solid var(--line-2);
  border-radius:8px;padding:9px 12px;pointer-events:none;z-index:9;box-shadow:0 12px 34px rgba(0,0,0,.6);white-space:nowrap}
.tip b{font-size:12.5px;display:block}
.tip span{font-size:11px;color:var(--txt-3)}

/* ---------------- priorities ---------------- */
.prio{display:flex;gap:14px;padding:15px 18px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer;
  transition:background .15s}
.prio:first-child{border-top:0}
.prio:hover{background:var(--ink-2)}
.prio .bar{width:3px;align-self:stretch;border-radius:3px;flex:0 0 3px}
.tagp{font-size:9.5px;font-weight:750;letter-spacing:.12em;padding:3px 8px;border-radius:4px;white-space:nowrap}
.t-high{background:rgba(224,96,95,.14);color:var(--bad)}
.t-review{background:rgba(224,164,88,.14);color:var(--warn)}
.t-decision{background:rgba(91,141,239,.14);color:var(--info)}
.t-ok{background:rgba(63,185,132,.14);color:var(--ok)}
.t-gold{background:rgba(201,169,97,.14);color:var(--gold-2)}
.t-mut{background:var(--ink-3);color:var(--txt-3)}
.prio .bd{flex:1;min-width:0}
.prio .bd b{font-size:13.5px;font-weight:600;display:block}
.prio .bd p{font-size:12.5px;color:var(--txt-2);margin-top:3px}
.prio .mt{font-size:11px;color:var(--txt-4);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}

/* ---------------- buttons ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;
  border-radius:8px;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;letter-spacing:.01em}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.btn-g{background:var(--gold);color:#0C0A06}
.btn-g:hover{background:var(--gold-2)}
.btn-o{background:var(--ink-2);border:1px solid var(--line);color:var(--txt)}
.btn-o:hover{border-color:var(--line-2);background:var(--ink-3)}
.btn-q{color:var(--txt-2)} .btn-q:hover{color:var(--txt);background:var(--ink-3)}
.btn-ok{background:rgba(63,185,132,.12);border:1px solid rgba(63,185,132,.4);color:var(--ok)}
.btn-ok:hover{background:rgba(63,185,132,.2)}
.btn-bad{background:rgba(224,96,95,.1);border:1px solid rgba(224,96,95,.35);color:var(--bad)}
.btn-bad:hover{background:rgba(224,96,95,.18)}
.btn-warn{background:rgba(224,164,88,.1);border:1px solid rgba(224,164,88,.35);color:var(--warn)}
.btn-warn:hover{background:rgba(224,164,88,.18)}
.btn-lg{height:48px;padding:0 26px;font-size:14px;border-radius:9px}
.btn-sm{height:29px;padding:0 11px;font-size:11.5px;border-radius:6px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------------- kanban ---------------- */
.kb{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:14px}
.kcol{flex:0 0 292px;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.kcol.over{border-color:var(--gold);background:rgba(201,169,97,.04)}
.kcol-h{padding:13px 15px;border-bottom:1px solid var(--line)}
.kcol-h .r1{display:flex;align-items:center;gap:9px}
.kcol-h b{font-size:10.5px;letter-spacing:.13em;font-weight:750;color:var(--txt-2)}
.kcol-h .n{font-size:10.5px;font-weight:700;color:var(--txt-3);background:var(--ink-3);padding:1px 7px;border-radius:20px}
.kcol-h .sum{margin-left:auto;font-size:12px;font-weight:650;color:var(--gold-2)}
.kcol-l{padding:11px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px;min-height:90px}
.dcard{background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:13px;cursor:grab;
  transition:border-color .15s,transform .15s}
.dcard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.dcard.drag{opacity:.35}
.dcard .r1{display:flex;align-items:flex-start;gap:8px}
.dcard h4{font-size:13.5px;font-weight:650;flex:1}
.dcard .amt{font-family:var(--serif);font-size:16px;color:var(--gold-2);margin-top:9px;letter-spacing:-.01em}
.dcard .geo{font-size:11.5px;color:var(--txt-3);margin-top:3px}
.dcard .prog{margin-top:11px}
.dcard .prog .lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-4);margin-bottom:4px}
.dcard .next{font-size:11px;color:var(--txt-2);margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;gap:7px;align-items:center}
.dcard .next svg{width:12px;height:12px;stroke:var(--txt-4);fill:none;stroke-width:2;flex:0 0 12px}
.dcard .team{display:flex;gap:-6px;margin-top:9px}
.av-s{width:21px;height:21px;border-radius:50%;background:var(--ink-4);border:1.5px solid var(--ink-2);
  display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--txt-2);margin-right:-6px}
.risk{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:4px}
.risk.low{background:var(--ok)} .risk.med{background:var(--warn)} .risk.high{background:var(--bad)}
.bar{height:3px;background:var(--ink-4);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}

/* ---------------- detail ---------------- */
.dhead{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}
.dhead .t{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.dhead h1{font-family:var(--serif);font-size:31px;letter-spacing:-.02em}
.dhead .meta{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.dhead .meta div span{font-size:10px;letter-spacing:.12em;color:var(--txt-4);font-weight:700;display:block}
.dhead .meta div b{font-size:15px;font-weight:600;margin-top:4px;display:block}
.dhead .meta div b.g{font-family:var(--serif);font-size:22px;color:var(--gold-2);font-weight:400}
.tabs{display:flex;gap:1px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:22px}
.tab{padding:11px 15px;font-size:12.5px;font-weight:600;color:var(--txt-3);border-bottom:2px solid transparent;
  white-space:nowrap;transition:.15s}
.tab:hover{color:var(--txt-2)}
.tab.on{color:var(--gold-2);border-color:var(--gold)}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-family:var(--serif);font-size:29px;line-height:1}
.ring .mid span{font-size:9.5px;letter-spacing:.11em;color:var(--txt-3);font-weight:700;display:block;margin-top:4px}
.ddrow{display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--line)}
.ddrow:first-child{border-top:0}
.ddrow .nm{flex:0 0 128px;font-size:12.5px;color:var(--txt-2)}
.ddrow .bar{flex:1}
.ddrow .pc{flex:0 0 46px;text-align:right;font-size:12px;font-weight:650}
.chk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;flex:0 0 16px}
.chk.done{background:rgba(63,185,132,.16);color:var(--ok)}
.chk.wip{background:rgba(224,164,88,.16);color:var(--warn)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:11px 16px;font-size:13px}
.kv dt{color:var(--txt-3)} .kv dd{color:var(--txt)}
.reqrow{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}
.reqrow:first-child{border-top:0}

/* ---------------- findings ---------------- */
.find{border:1px solid var(--line);border-radius:9px;padding:16px;background:var(--ink-1);margin-bottom:11px}
.find .r1{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.find h4{font-size:13.5px;font-weight:650}
.find p{font-size:13px;color:var(--txt-2);line-height:1.6}
.find .src{font-size:11px;color:var(--txt-4);margin-top:9px;font-family:var(--mono)}
.find .acts{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.find.gone{opacity:.4}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:9px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt-2)}
.legend i{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.legend b{margin-left:auto;color:var(--txt);font-weight:650}

/* ---------------- tables ---------------- */
table{width:100%;border-collapse:collapse}
th{font-size:9.5px;letter-spacing:.13em;font-weight:750;color:var(--txt-4);text-align:left;padding:11px 14px;
  border-bottom:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .13s}
tbody tr:hover{background:var(--ink-2)}
.tw{overflow-x:auto}

/* ---------------- IC / approvals ---------------- */
.gate{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);
  border-radius:8px;background:var(--ink-1);margin-bottom:9px}
.gate.done{border-color:rgba(63,185,132,.3)}
.gate .nm{flex:1;font-size:13px;font-weight:600}
.gate .who{font-size:11.5px;color:var(--txt-3)}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:24px}
.decide button{height:64px;border-radius:10px;font-size:14px;font-weight:700;letter-spacing:.07em}
.audit{font-family:var(--mono);font-size:11.5px;color:var(--txt-3);padding:9px 0;border-top:1px solid var(--line);
  display:flex;gap:14px}
.audit b{color:var(--txt-2);font-weight:600}
.audit .ts{color:var(--txt-4);flex:0 0 132px}

/* ---------------- builder ---------------- */
.bhero{text-align:center;padding:56px 20px 40px}
.bhero h1{font-family:var(--serif);font-size:clamp(32px,4.6vw,58px);letter-spacing:-.03em;line-height:1.05}
.bhero p{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--gold-2);margin-top:16px}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.mod{border:1px solid var(--line);border-radius:9px;padding:20px 16px;background:var(--ink-1);cursor:pointer;
  transition:.18s;text-align:center;position:relative;overflow:hidden}
.mod:hover{border-color:var(--gold-dim);transform:translateY(-3px)}
.mod.on{border-color:var(--gold);background:rgba(201,169,97,.06)}
.mod .i{width:36px;height:36px;border-radius:9px;background:var(--ink-3);display:grid;place-items:center;margin:0 auto 12px}
.mod .i svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.6}
.mod b{font-size:12.5px;font-weight:600;display:block}
.mod span{font-size:10.5px;color:var(--txt-4);display:block;margin-top:4px}
.genbox{border:1px solid var(--line);border-radius:12px;background:var(--ink-1);padding:30px;margin-top:26px}
.genbox h3{font-family:var(--serif);font-size:23px;letter-spacing:-.02em}
.genin{display:flex;gap:11px;margin-top:20px;flex-wrap:wrap}
.genin input{flex:1;min-width:260px;height:50px;background:var(--ink-2);border:1px solid var(--line-2);
  border-radius:9px;padding:0 17px;outline:none;font-size:14.5px}
.genin input:focus{border-color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:11.5px;color:var(--txt-3);border:1px solid var(--line);border-radius:20px;padding:6px 13px;
  cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--gold-dim);color:var(--gold-2)}
.genout{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:24px}
.gmod{border:1px solid rgba(201,169,97,.3);background:rgba(201,169,97,.05);border-radius:9px;padding:15px;
  opacity:0;transform:translateY(12px);animation:pop .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.gmod b{font-size:12.5px;font-weight:650;display:block}
.gmod span{font-size:11px;color:var(--txt-3);display:block;margin-top:5px;line-height:1.5}
.gmod .n{font-family:var(--mono);font-size:10px;color:var(--gold-dim);display:block;margin-bottom:7px}

/* ---------------- security ---------------- */
.secgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.secit{border:1px solid var(--line);border-radius:9px;padding:18px;background:var(--ink-1)}
.secit .i{width:32px;height:32px;border-radius:8px;background:var(--ink-3);display:grid;place-items:center;margin-bottom:12px}
.secit .i svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6}
.secit b{font-size:12.5px;font-weight:650;display:block}
.secit span{font-size:11.5px;color:var(--txt-3);display:block;margin-top:5px;line-height:1.5}

/* ---------------- overlays ---------------- */
.ov{position:fixed;inset:0;background:rgba(4,6,9,.78);backdrop-filter:blur(4px);z-index:90;display:flex;
  align-items:center;justify-content:center;padding:26px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
.mdl{background:var(--ink-1);border:1px solid var(--line-2);border-radius:13px;width:100%;max-width:600px;
  max-height:88vh;display:flex;flex-direction:column;animation:rise .22s cubic-bezier(.2,.7,.2,1);overflow:hidden}
.mdl.lg{max-width:920px} .mdl.xl{max-width:1120px}
.mdl-h{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px}
.mdl-h h3{font-size:15px;font-weight:650;flex:1}
.mdl-b{padding:22px;overflow-y:auto}
.mdl-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.drw{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100%;background:var(--ink-1);z-index:92;
  border-left:1px solid var(--line-2);display:flex;flex-direction:column;animation:slidein .24s cubic-bezier(.2,.7,.2,1)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.fld label{font-size:11px;letter-spacing:.06em;color:var(--txt-3);font-weight:600}
.fld input,.fld select,.fld textarea{height:39px;background:var(--ink-2);border:1px solid var(--line);
  border-radius:8px;padding:0 12px;outline:none;font-size:13.5px}
.fld textarea{height:auto;min-height:92px;padding:11px 12px;resize:vertical;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}

/* memo / summary sheet */
.memo{background:#0F1319;border:1px solid var(--line);border-radius:10px;padding:40px}
.memo .mh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--gold);
  padding-bottom:16px;margin-bottom:26px;gap:20px;flex-wrap:wrap}
.memo .mh b{font-family:var(--serif);font-size:21px;letter-spacing:.02em}
.memo .mh span{font-size:10px;letter-spacing:.15em;color:var(--txt-3);display:block;margin-top:4px;font-weight:700}
.memo h4{font-size:10px;letter-spacing:.15em;color:var(--gold-2);font-weight:750;margin:24px 0 10px}
.memo p{font-size:13.5px;line-height:1.75;color:var(--txt-2)}
.memo .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:8px 0 4px}
.memo .mgrid div span{font-size:9.5px;letter-spacing:.12em;color:var(--txt-4);font-weight:700;display:block}
.memo .mgrid div b{font-family:var(--serif);font-size:19px;display:block;margin-top:5px}

/* AI assistant */
.aifab{position:fixed;right:24px;bottom:24px;width:50px;height:50px;border-radius:50%;z-index:80;
  background:linear-gradient(145deg,var(--ink-4),var(--ink-2));border:1px solid var(--line-2);
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.2s}
.aifab:hover{border-color:var(--gold);transform:scale(1.06)}
.aifab svg{width:20px;height:20px;stroke:var(--gold-2);fill:none;stroke-width:1.6}
.aipanel{position:fixed;right:24px;bottom:86px;width:376px;max-width:calc(100vw - 40px);height:480px;z-index:81;
  background:var(--ink-1);border:1px solid var(--line-2);border-radius:13px;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.6);animation:rise .2s cubic-bezier(.2,.7,.2,1);overflow:hidden}
.aimsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px}
.aim{max-width:86%;padding:10px 13px;border-radius:11px;font-size:13px;line-height:1.55}
.aim.a{background:var(--ink-3);align-self:flex-start;border-bottom-left-radius:4px}
.aim.u{background:rgba(201,169,97,.14);color:var(--gold-2);align-self:flex-end;border-bottom-right-radius:4px}
.aiin{padding:12px;border-top:1px solid var(--line);display:flex;gap:9px}
.aiin input{flex:1;height:36px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;
  padding:0 12px;outline:none;font-size:13px}
.aiin input:focus{border-color:var(--gold)}

.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;
  flex-direction:column;gap:9px;align-items:center}
.toast{background:var(--ink-3);border:1px solid var(--line-2);padding:12px 18px;border-radius:9px;font-size:13px;
  font-weight:500;box-shadow:0 14px 38px rgba(0,0,0,.6);animation:rise .18s ease;max-width:420px}
.toast.ok{border-color:rgba(63,185,132,.45)} .toast.bad{border-color:rgba(224,96,95,.45)}
.toast.gold{border-color:rgba(201,169,97,.5)}

.empty{padding:56px 20px;text-align:center;color:var(--txt-4)}
.empty b{display:block;color:var(--txt-2);font-size:14px;margin-bottom:6px}

/* responsive — desktop + iPad */
@media(max-width:1400px){.g6{grid-template-columns:repeat(3,1fr)}.mods{grid-template-columns:repeat(4,1fr)}
  .genout,.secgrid{grid-template-columns:repeat(3,1fr)}}

  .mods,.genout,.secgrid{grid-template-columns:repeat(2,1fr)}

}
@media(max-width:760px){
  .g6,.g4,.g2{grid-template-columns:1fr}.search{display:none}.me b,.me span{display:none}
  .decide{grid-template-columns:1fr}.mods,.genout,.secgrid{grid-template-columns:1fr}

}

/* knowledge search results */
.ksr{position:absolute;top:40px;left:0;right:0;background:var(--ink-2);border:1px solid var(--line-2);

.ksr-i:last-child{border-bottom:0}
.ksr-i:hover{background:var(--ink-3)}
.ksr-i b{font-size:12.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ksr-i span{font-size:11px;color:var(--txt-3);display:block;margin-top:2px}
.ksr-e{padding:16px;text-align:center;font-size:12.5px;color:var(--txt-4)}

/* =====================================================================
   LEDGER — second design direction
   Editorial institutional finance: paper, hairlines, typographic grid.
   Not a recolour — the structural devices change.
   ===================================================================== */
body[data-theme="ledger"]{
  --ink:#F7F5F1; --ink-1:#FFFFFF; --ink-2:#FBFAF7; --ink-3:#F1EEE8; --ink-4:#E6E2DA;
  --line:rgba(24,26,29,.12); --line-2:rgba(24,26,29,.26);
  --txt:#181A1D; --txt-2:#55595F; --txt-3:#82878E; --txt-4:#A8ADB4;
  --gold:#8C6D2F; --gold-2:#6E5522; --gold-dim:#B9A madeira;
  --gold-dim:#BCA97C;
  --ok:#1F6B4A; --warn:#95651A; --bad:#9B2C2C; --info:#274C86; --violet:#4A3D8F;
  --r:0px;
  background:var(--ink); color:var(--txt);
}

body[data-theme="ledger"] .card,
body[data-theme="ledger"] .kpi,
body[data-theme="ledger"] .kcol,
body[data-theme="ledger"] .dcard,
body[data-theme="ledger"] .find,

body[data-theme="ledger"] .secit,

body[data-theme="ledger"] .card,
body[data-theme="ledger"] .kpi{background:var(--ink-1);border-color:var(--line)}
body[data-theme="ledger"] .rail{background:var(--ink-2);border-right:1px solid var(--line)}
body[data-theme="ledger"] .top{background:var(--ink-1);border-bottom:1px solid var(--line-2)}
body[data-theme="ledger"] .brand .mk{background:var(--txt);color:#F7F5F1;border-radius:0}
body[data-theme="ledger"] .nav{border-radius:0}
body[data-theme="ledger"] .nav.on{background:transparent;color:var(--txt);font-weight:650}

body[data-theme="ledger"] .mkbtn:hover{background:var(--txt);color:var(--ink-1);border-color:var(--txt)}
body[data-theme="ledger"] .btn{border-radius:0;letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:700}

body[data-theme="ledger"] .btn-g:hover{background:#000}
body[data-theme="ledger"] .btn-o{background:transparent;border:1px solid var(--line-2);color:var(--txt)}

body[data-theme="ledger"] .search input,body[data-theme="ledger"] .fld input,
body[data-theme="ledger"] .fld select,body[data-theme="ledger"] .fld textarea{
  border-radius:0;background:var(--ink-1);border-color:var(--line-2)}

body[data-theme="ledger"] .aim.u{background:var(--txt);color:var(--ink-1);border-radius:0}

body[data-theme="ledger"] .kcol{background:var(--ink-2)}
body[data-theme="ledger"] .dcard{background:var(--ink-1)}
body[data-theme="ledger"] .kcol.over{background:var(--ink-3);border-color:var(--txt)}

/* --- editorial devices --- */
.tape{height:30px;flex:0 0 30px;border-bottom:1px solid var(--line);background:var(--ink-1);

.tape-i .up{color:var(--ok)} .tape-i .dn{color:var(--bad)}
.tape-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--txt-4);

body[data-theme="ledger"] .sec h2{color:var(--txt);font-weight:750}
body[data-theme="ledger"] .sec .ln{background:var(--line-2)}
body[data-theme="ledger"] .sec a,body[data-theme="ledger"] .sec button{color:var(--txt);
  border-bottom:1px solid var(--txt);padding-bottom:1px}
body[data-theme="ledger"] .kpi .v{color:var(--txt)}

body[data-theme="ledger"] .kpi.warn .v{color:var(--warn)}
body[data-theme="ledger"] .kpi.gold .v{color:var(--txt)}
body[data-theme="ledger"] .kpi .l{color:var(--txt-3)}
body[data-theme="ledger"] .kpi{border-top:2px solid var(--txt)}
body[data-theme="ledger"] .dcard .amt{color:var(--txt)}
body[data-theme="ledger"] .dhead .meta div b.g{color:var(--txt)}
body[data-theme="ledger"] .kcol-h .sum{color:var(--txt)}
body[data-theme="ledger"] .bhero h1{color:var(--txt)}
body[data-theme="ledger"] .bhero p{color:var(--txt-2)}

body[data-theme="ledger"] .mod .i svg,body[data-theme="ledger"] .secit .i svg{stroke:var(--txt)}
body[data-theme="ledger"] .secit .i{background:var(--ink-3);border-radius:0}
body[data-theme="ledger"] .find{background:var(--ink-1)}
body[data-theme="ledger"] .audit{color:var(--txt-3)}

/* theme switch */
.tsw{display:flex;border:1px solid var(--line);height:30px;flex:0 0 auto}
.tsw button{padding:0 11px;font-size:9.5px;font-weight:750;letter-spacing:.12em;color:var(--txt-3)}
.tsw button.on{background:var(--txt);color:var(--ink-1)}

.ccell:hover .cdot{fill:var(--gold-2)}

/* ================= GEMCORP FLOW — core ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>Number(n||0).toLocaleString('en-US');

  const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';};

  const t=el(`<div class="toast ${kind}">${esc(msg)}</div>`);b.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.28s';setTimeout(()=>t.remove(),300);},2900);}
const closeOv=()=>$$('.ov,.drw').forEach(x=>x.remove());

const I={

function setNav(r){
  $$('.nav').forEach(a=>a.classList.toggle('on',a.dataset.r===r));

function wireSearch(){
  const inp=$('#gq'), box=inp.closest('.search');
  const close=()=>{const r=$('.ksr');if(r)r.remove();};
  const run=()=>{
    close();
    const q=inp.value.trim().toLowerCase(); if(q.length<2)return;
    const hits=[];
    DEALS.filter(x=>(x.n+x.c+x.s+x.lead).toLowerCase().includes(q)).slice(0,4)
      .forEach(x=>hits.push({k:'DEAL',t:x.n,s:`${x.c} · ${x.s} · ${USD(x.v)}`,go:()=>openDeal(x.id)}));
    DOCS.filter(x=>(x.n+x.cat+x.by).toLowerCase().includes(q)).slice(0,3)
      .forEach(x=>hits.push({k:'DOCUMENT',t:x.n,s:`${x.cat} · ${x.v}`,go:()=>{location.hash='#/documents';}}));
    FINDINGS.filter(x=>(x.t+x.cat+x.d+x.src+' horizon').toLowerCase().includes(q)).slice(0,3)
      .forEach(x=>hits.push({k:'FINDING',t:x.t,s:`${x.cat} · AI analysis`,go:()=>{location.hash='#/ai';}}));
    ALERTS.filter(x=>{const d=dealById(x.deal);
      return (x.t+x.cat+x.d+(d?d.n+d.c:'')).toLowerCase().includes(q);}).slice(0,3)
      .forEach(x=>{const d=dealById(x.deal);
        hits.push({k:'ALERT',t:x.t,s:`${d?d.n+' · ':''}${x.cat} · ${USD(x.exp)} exposure`,
          go:()=>{location.hash='#/risk';}});});
    if(!hits.length){
      box.appendChild(el(`<div class="ksr"><div class="ksr-e">No match for “${esc(inp.value)}”</div></div>`));
      return;}
    const r=el(`<div class="ksr"><div class="ksr-h">${hits.length} results across the platform</div>
      ${hits.map((h,i)=>`<div class="ksr-i" data-h="${i}"><span class="tagp t-mut">${h.k}</span>
        <div style="flex:1;min-width:0"><b>${esc(h.t)}</b><span>${esc(h.s)}</span></div></div>`).join('')}</div>`);
    box.appendChild(r);
    $$('[data-h]',r).forEach(x=>x.onmousedown=()=>{close();inp.value='';hits[+x.dataset.h].go();});
  };
  inp.addEventListener('input',run);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('.ksr-i');if(f)f.dispatchEvent(new Event('mousedown'));}
    if(e.key==='Escape')close();});
  inp.addEventListener('blur',()=>setTimeout(close,180));
}

}

function modal({title,sub,body,footer,size=''}){
  const ov=el(`<div class="ov"><div class="mdl ${size}">
    <div class="mdl-h"><div style="flex:1"><h3>${esc(title)}</h3>${sub?`<p style="font-size:11.5px;color:var(--txt-3);margin-top:2px">${esc(sub)}</p>`:''}</div>
      <span class="demo">SAMPLE DATA</span>
      <button class="ico" data-close>${svg('x')}</button></div>
    <div class="mdl-b">${body}</div>${footer?`<div class="mdl-f">${footer}</div>`:''}</div></div>`);
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))ov.remove();});
  document.body.appendChild(ov); return ov;
}
const ringSVG=(pct,size=132,stroke=9,col='var(--gold)')=>{
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ink-4)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"
      style="transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)"/></svg>`;
};
function sparkline(vals,w=200,h=34,col='var(--gold)'){
  const mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-((v-mn)/sp)*(h-6)-3]);
  const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="${col}" opacity=".08"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" opacity=".55"/></svg>`;
}
const riskLbl={low:'Low',med:'Medium',high:'High'};
const avatars=t=>t.map(k=>`<i class="av-s" title="${esc(TEAM[k]||k)}">${k}</i>`).join('');

    <div class="mdl-h"><div style="flex:1"><h3>Intelligence Assistant</h3>

  document.body.appendChild(panel);
  const msgs=[{r:'a',t:'Good evening, Atanas. Three items need attention tonight. Ask me anything about the pipeline, or I can walk you through Project Horizon.'}];

/* ---------------- world map ---------------- */
function drawMap(host){
  /* dot cartogram: each cell is a position, grouped by region.
     Abstract by design — an index of exposure, not a survey map. */
  const COLS=44, ROWS=15, cw=22, ch=22, W=COLS*cw, H=ROWS*ch;
  const bands={africa:[16,26],me:[27,32],asia:[33,43],latam:[3,13]};
  const cells=[];
  REGIONS.forEach(rg=>{
    const [c0,c1]=bands[rg.k];
    for(let c=c0;c<=c1;c++)for(let r=3;r<ROWS-2;r++){
      const t=(Math.sin(c*.7)+Math.cos(r*.9))*.5;
      if(t>-.25) cells.push({c,r,rg});
    }
  });
  const perRegion={}; REGIONS.forEach(r=>perRegion[r.k]=[]);
  cells.forEach(x=>perRegion[x.rg.k].push(x));
  const pinCell={};
  DEALS.forEach((d,i)=>{
    const k=['africa','me','asia','latam'][
      ['Angola','Ghana','Nigeria','Kenya','Zambia','Morocco','Egypt'].includes(d.c)?0:
      ['UAE'].includes(d.c)?1:['India','Kazakhstan'].includes(d.c)?2:3];
    const pool=perRegion[k]; if(!pool||!pool.length)return;
    const cell=pool[Math.floor(pool.length/2+ (i*7)%Math.max(1,pool.length/2) - pool.length/6)]||pool[0];
    pinCell[d.id]={...cell,d};
  });
  const hot=new Set(['HOR','NOV']);
  host.innerHTML=`<svg class="carto" viewBox="0 0 ${W} ${H+52}">
    ${cells.map(x=>`<rect x="${x.c*cw+4}" y="${x.r*ch+40}" width="${cw-8}" height="${ch-8}"
      fill="currentColor" opacity=".07"/>`).join('')}
    ${REGIONS.map(rg=>{const [c0,c1]=bands[rg.k];
      return `<text x="${(c0+ (c1-c0)/2)*cw}" y="30" text-anchor="middle" font-size="10"
        letter-spacing="2.4" font-weight="700" fill="currentColor" opacity=".42">${rg.n.toUpperCase()}</text>`;}).join('')}
    ${Object.entries(pinCell).map(([id,p])=>{
      const d=p.d, sz=Math.max(4,Math.min(8.5,d.v/1e6/16));
      return `<g class="ccell mpin ${hot.has(id)?'hot':''}" data-pin="${id}">
        <rect x="${p.c*cw+4}" y="${p.r*ch+40}" width="${cw-8}" height="${ch-8}" fill="transparent"/>
        <circle class="halo" cx="${p.c*cw+cw/2}" cy="${p.r*ch+40+ch/2-4}" r="${sz+6}"/>
        <circle class="cdot core" cx="${p.c*cw+cw/2}" cy="${p.r*ch+40+ch/2-4}" r="${sz}"/></g>`;}).join('')}
  </svg>
  <div class="mapstat"><div class="t">PIPELINE EXPOSURE</div>
    ${REGIONS.map(r=>`<div class="r" data-reg="${r.k}" style="cursor:pointer">
      <span>${r.n}</span><b class="num">${USD(r.exp)}</b></div>`).join('')}</div>
  <div class="maplegend">
    <div><i></i>Active position — size by ticket</div>
    <div><i style="background:var(--bad)"></i>Requires attention</div>
    <div style="color:var(--txt-4)">${DEALS.length} positions · sample data</div></div>`;
  host.style.color='var(--txt)';
  $$('[data-pin]',host).forEach(g=>{
    const d=dealById(g.dataset.pin);
    g.addEventListener('mouseenter',()=>{
      const r=g.getBoundingClientRect(), hb=host.getBoundingClientRect();
      const t=el(`<div class="tip" style="left:${r.left-hb.left+r.width/2}px;top:${r.top-hb.top}px">
        <b>${esc(d.n)}</b><span>${esc(d.c)} · ${esc(d.s)} · ${USD(d.v)}</span></div>`);
      host.appendChild(t); g._t=t;});
    g.addEventListener('mouseleave',()=>{if(g._t){g._t.remove();g._t=null;}});
    g.addEventListener('click',()=>openDeal(d.id));
  });
  $$('[data-reg]',host).forEach(r=>r.onclick=()=>{
    const rg=REGIONS.find(x=>x.k===r.dataset.reg);
    toast(`${rg.n}: ${rg.deals} active opportunities · ${USD(rg.exp)} exposure`,'gold');});
}

      <div style="flex:1"><div class="bar" style="height:3px"><i id="bbar" style="width:0%"></i></div></div></div>`;
    let p=0;
    const iv=setInterval(()=>{p=Math.min(100,p+14+Math.random()*10);$('#bbar').style.width=p+'%';
      if(p>=100){clearInterval(iv);show();}},110);
    function show(){
      out.innerHTML=`<div class="sec"><h2>PROPOSED SYSTEM</h2><div class="ln"></div>
          <span style="font-size:11px;color:var(--txt-4)">${mods.length} modules · generated from your description</span></div>
        <div class="genout">${mods.map(([n,d],i)=>`<div class="gmod" style="animation-delay:${i*70}ms">
          <span class="n">MODULE ${pad2(i+1)}</span><b>${n}</b><span>${d}</span></div>`).join('')}</div>
        <div class="grid g3" style="margin-top:20px">
          ${[['ESTIMATED BUILD','3 weeks'],['INTEGRATIONS','ERP · email · e-signature'],
             ['USERS AT LAUNCH','40 – 120']].map(([l,val])=>`<div class="card" style="padding:16px 18px">
            <div class="l" style="font-size:10px;letter-spacing:.12em;color:var(--txt-4);font-weight:700">${l}</div>
            <b style="font-family:var(--serif);font-size:20px;display:block;margin-top:7px">${val}</b></div>`).join('')}</div>
        <div class="btnrow" style="margin-top:20px;justify-content:flex-end">
          <button class="btn btn-o" id="bRefine">Refine description</button>
          <button class="btn btn-g" id="bSave">${svg('check')}Save this system</button></div>`;
      $('#bRefine').onclick=()=>$('#bq').focus();
      $('#bSave').onclick=()=>{DB.systems.unshift({t:Date.now(),q,mods:mods.map(m=>m[0])});save();
        audit('Custom system generated',q.slice(0,60));
        toast('System saved — '+mods.length+' modules','ok');};
      audit('System generated from description',q.slice(0,60));
    }
  }
};

/* ============ REMAINING SCREENS ============ */
function listPage(v,{title,sub,rows,cols,onRow,kpis}){
  v.innerHTML=`<div class="pad">
    <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px">
      <div style="flex:1"><h1 class="hero" style="font-size:27px">${esc(title)}</h1>
        <p class="lede" style="font-size:13.5px">${esc(sub)}</p></div>
      <span class="demo">CONCEPT DEMO — SAMPLE DATA</span></div>
    ${kpis?`<div class="grid g4" style="margin-bottom:22px">${kpis.map(([l,n,c])=>
      `<div class="kpi ${c||''}" style="cursor:default"><div class="l">${l}</div>
       <div class="v num">${n}</div></div>`).join('')}</div>`:''}
    <div class="card"><div class="tw"><table><thead><tr>${cols.map(c=>
      `<th class="${c.n?'n':''}">${c.h}</th>`).join('')}</tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-i="${i}">${cols.map(c=>
        `<td class="${c.n?'n':''}">${c.r(r)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div></div></div>`;
  if(onRow)$$('tbody tr').forEach(tr=>tr.onclick=()=>onRow(rows[+tr.dataset.i]));
}
const dealCols=[
 {h:'DEAL',r:d=>`<b style="font-weight:600">${esc(d.n)}</b>`},
 {h:'COUNTRY',r:d=>`<span style="color:var(--txt-3)">${esc(d.c)}</span>`},
 {h:'SECTOR',r:d=>`<span style="color:var(--txt-3)">${esc(d.s)}</span>`},
 {h:'SIZE',n:1,r:d=>`<b class="num" style="color:var(--gold-2)">${USD(d.v)}</b>`},
 {h:'STAGE',r:d=>`<span class="tagp t-mut">${STLBL[stageOf(d)]}</span>`},
 {h:'RISK',r:d=>`<span class="tagp ${d.risk==='low'?'t-ok':d.risk==='med'?'t-review':'t-high'}">${riskLbl[d.risk].toUpperCase()}</span>`},
 {h:'DD',n:1,r:d=>`<span class="num">${d.dd}%</span>`},
 {h:'IRR',n:1,r:d=>`<span class="num">${d.irr}%</span>`},
 {h:'LEAD',r:d=>`<span style="color:var(--txt-3)">${esc(d.lead)}</span>`}];
PAGES.investments=v=>listPage(v,{title:'Investments',sub:'All transactions across pipeline and portfolio.',
  rows:DEALS,cols:dealCols,onRow:d=>openDeal(d.id),
  kpis:[['TOTAL TRANSACTIONS',DEALS.length],['AGGREGATE SIZE',USD(DEALS.reduce((a,d)=>a+d.v,0)),'gold'],
    ['AVERAGE IRR',(DEALS.reduce((a,d)=>a+d.irr,0)/DEALS.length).toFixed(1)+'%'],
    ['MARKETS',new Set(DEALS.map(d=>d.c)).size]]});
PAGES.dd=v=>{
  const rows=DEALS.filter(d=>['dd','screen'].includes(stageOf(d)));
  listPage(v,{title:'Due Diligence',sub:'Active workstreams and completion by transaction.',
    rows,cols:[...dealCols.slice(0,4),
      {h:'PROGRESS',r:d=>`<div style="display:flex;align-items:center;gap:9px;min-width:150px">
        <span class="bar ${d.dd>=90?'ok':d.dd>=50?'':'warn'}" style="flex:1"><i style="width:${d.dd}%"></i></span>
        <span class="num" style="font-size:12px">${d.dd}%</span></div>`},
      {h:'NEXT ACTION',r:d=>`<span style="color:var(--txt-3)">${esc(d.next)}</span>`},
      {h:'DAYS',n:1,r:d=>`<span class="num">${d.days}</span>`}],
    onRow:d=>openDeal(d.id),
    kpis:[['IN DUE DILIGENCE',rows.length],['CAPITAL UNDER REVIEW',USD(rows.reduce((a,d)=>a+d.v,0)),'gold'],
      ['AVERAGE COMPLETION',Math.round(rows.reduce((a,d)=>a+d.dd,0)/Math.max(1,rows.length))+'%'],
      ['OPEN ACTIONS','11','warn']]});
};
PAGES.portfolio=v=>{
  const rows=DEALS.filter(d=>['port','appr'].includes(stageOf(d)));
  listPage(v,{title:'Portfolio',sub:'Deployed and committed positions under management.',
    rows,cols:dealCols,onRow:d=>openDeal(d.id),
    kpis:[['TOTAL PORTFOLIO','$9.0B+','gold'],['ACTIVE POSITIONS',rows.length],
      ['MARKETS','25+'],['WEIGHTED IRR',(rows.reduce((a,d)=>a+d.irr,0)/Math.max(1,rows.length)).toFixed(1)+'%']]});
};
PAGES.approvals=v=>{
  const rows=[...DEALS.filter(d=>['ic','appr'].includes(stageOf(d))).map(d=>({
    n:d.n,t:'Investment approval',v:d.v,who:d.lead,st:stageOf(d)==='ic'?'Pending IC':'Approved',id:d.id})),
    {n:'Project Horizon',t:'Document request — collateral valuation',v:0,who:'A. Kovachev',st:'Pending',id:'HOR'},
    {n:'Project Silk',t:'Covenant waiver',v:76e6,who:'H. Tanaka',st:'Pending',id:'SIL'}];
  listPage(v,{title:'Approvals',sub:'Items awaiting a named approver. Nothing executes without sign-off.',
    rows,cols:[
      {h:'ITEM',r:r=>`<b style="font-weight:600">${esc(r.t)}</b>`},
      {h:'TRANSACTION',r:r=>`<span style="color:var(--txt-3)">${esc(r.n)}</span>`},
      {h:'VALUE',n:1,r:r=>r.v?`<b class="num" style="color:var(--gold-2)">${USD(r.v)}</b>`:'—'},
      {h:'OWNER',r:r=>`<span style="color:var(--txt-3)">${esc(r.who)}</span>`},
      {h:'STATUS',r:r=>`<span class="tagp ${r.st==='Approved'?'t-ok':'t-review'}">${r.st.toUpperCase()}</span>`}],
    onRow:r=>{if(r.st.includes('IC'))location.hash='#/ic';else openDeal(r.id);},
    kpis:[['AWAITING APPROVAL','4','warn'],['APPROVED THIS MONTH','6'],
      ['AVG TIME TO DECISION','4.2 days'],['ESCALATIONS','1','crit']]});
};
PAGES.reports=function(v){
  const REPS=[['Quarterly Portfolio Review','Board','Q3 2026','Ready'],
    ['Investment Committee Pack','Committee','September','Ready'],
    ['Risk & Exposure Summary','Risk','Weekly','Ready'],
    ['Regulatory Filing Extract','Compliance','H1 2026','Draft'],
    ['Investor Update','LP relations','Q3 2026','Draft'],
    ['Pipeline Analytics','Management','Live','Ready']];
  v.innerHTML=`<div class="pad">
    <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px">
      <div style="flex:1"><h1 class="hero" style="font-size:27px">Reports</h1>
        <p class="lede" style="font-size:13.5px">Assembled from live platform data — not re-keyed.</p></div>
      <span class="demo">CONCEPT DEMO — SAMPLE DATA</span></div>
    <div class="grid g3">${REPS.map(([n,aud,per,st])=>`<div class="card" data-rep="${esc(n)}"
      style="cursor:pointer;transition:.18s">
      <div class="card-b"><div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
        <span class="tagp ${st==='Ready'?'t-ok':'t-review'}">${st.toUpperCase()}</span>
        <div style="flex:1"></div><span style="font-size:11px;color:var(--txt-4)">${per}</span></div>
        <b style="font-size:15px;display:block">${n}</b>
        <span style="font-size:12px;color:var(--txt-3);display:block;margin-top:5px">Audience · ${aud}</span>
        <div class="btnrow" style="margin-top:16px">
          <button class="btn btn-o btn-sm">${svg('eye')}Preview</button>
          <button class="btn btn-g btn-sm">${svg('dl')}Generate</button></div></div></div>`).join('')}</div></div>`;
  $$('[data-rep]').forEach(c=>c.onclick=()=>{audit('Report generated',c.dataset.rep);
    toast(c.dataset.rep+' generated','ok');});
};
PAGES.settings=function(v){
  v.innerHTML=`<div class="pad">
    <div style="margin-bottom:22px"><h1 class="hero" style="font-size:27px">Settings</h1>
      <p class="lede" style="font-size:13.5px">Platform configuration, security posture and integrations.</p></div>
    <div class="sec" style="margin-top:0"><h2>ENTERPRISE SECURITY</h2><div class="ln"></div>
      <span style="font-size:11px;color:var(--gold-2);font-weight:700;letter-spacing:.1em">YOUR DATA. YOUR CONTROL.</span></div>
    <div class="secgrid">${SECURITY.map(([t,i,d])=>`<div class="secit">
      <div class="i">${svg(i)}</div><b>${t}</b><span>${d}</span></div>`).join('')}</div>
    <div class="grid g2" style="margin-top:26px">
      <div class="card"><div class="card-h"><div style="flex:1"><h3>Workspace</h3></div></div>
        <div class="card-b"><dl class="kv">
          <dt>Organisation</dt><dd>Gemcorp Capital</dd><dt>Environment</dt><dd>Private tenant · EU region</dd>
          <dt>Users</dt><dd class="num">148</dd><dt>Retention policy</dt><dd>7 years from maturity</dd>
          <dt>Data residency</dt><dd>Single region · no cross-border replication</dd>
          <dt>Model training</dt><dd>Disabled on customer data</dd></dl></div></div>
      <div class="card"><div class="card-h"><div style="flex:1"><h3>Audit trail</h3>
        <p>Every action, immutable and exportable</p></div>
        <button class="btn btn-o btn-sm" id="expAudit">${svg('dl')}Export</button></div>
        <div class="card-b" style="max-height:320px;overflow-y:auto" id="auditList"></div></div></div></div>`;
  const seed=[{t:Date.now()-3.6e6,who:'H. Tanaka',action:'Risk review completed',detail:'Project Indus'},
    {t:Date.now()-9e6,who:'AI Engine',action:'Document analysis run',detail:'147 documents'},
    {t:Date.now()-1.6e7,who:'P. Dias',action:'Compliance sign-off',detail:'Project Pampas'}];
  const rows=[...DB.audit,...seed];
  $('#auditList').innerHTML=rows.length?rows.map(a=>`<div class="audit">
    <span class="ts">${stamp(new Date(a.t))}</span><b>${esc(a.who)}</b>
    <span style="flex:1">${esc(a.action)}${a.detail?' — '+esc(a.detail):''}</span></div>`).join('')
    :`<div class="empty"><b>No entries yet</b></div>`;
  $('#expAudit').onclick=()=>{
    const csv=['Timestamp,User,Action,Detail',...rows.map(a=>
      `"${stamp(new Date(a.t))}","${a.who}","${a.action}","${a.detail||''}"`)].join('\n');
    const el2=document.createElement('a');el2.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    el2.download='gemcorp-audit-trail.csv';el2.click();toast('Audit trail exported','ok');};
};

/* boot */
shell(); route();
